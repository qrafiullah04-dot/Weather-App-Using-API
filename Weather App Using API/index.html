<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>🌤 Weather App</h1>
        <button id="unitToggleBtn" class="unit-toggle">°C</button>
    </div>

    <div class="search">
        <div class="search-row">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>
        <button id="locationBtn">📍 Current Location</button>
    </div>

    <div class="quick-cities">
        <button class="city-btn" data-city="Islamabad">Islamabad</button>
        <button class="city-btn" data-city="Lahore">Lahore</button>
        <button class="city-btn" data-city="Peshawar">Peshawar</button>
        <button class="city-btn" data-city="Muzaffarabad">Muzaffarabad</button>
        <button class="city-btn" data-city="Mardan">Mardan</button>
        <button class="city-btn" data-city="Quetta">Quetta</button>
        <button class="city-btn" data-city="Karachi">Karachi</button>
    </div>

    <div id="errorBox" class="error-msg" style="display: none;">
        <p id="errorText"></p>
    </div>

    <div id="weatherBox" style="display: none;">
        
        <div class="weather-header">
            <h2 id="city"></h2>
            <button id="favoriteBtn" class="fav-btn">⭐ Save City</button>
        </div>

        <h1 id="temperature"></h1>
        <h3 id="condition"></h3>
        <div id="icon"></div>

        <div class="details-grid">
            <div class="detail-card">
                <span>Feels Like</span>
                <strong id="feelsLike">--</strong>
            </div>
            <div class="detail-card">
                <span>Humidity</span>
                <strong id="humidity">--%</strong>
            </div>
            <div class="detail-card">
                <span>Wind</span>
                <strong id="windSpeed">--</strong>
            </div>
            <div class="detail-card">
                <span>UV Index</span>
                <strong id="uvIndex">--</strong>
            </div>
        </div>

        <div class="forecast-container">
            <h3>3-Day Forecast</h3>
            <div id="forecastGrid" class="forecast-grid"></div>
        </div>

    </div>

    <div id="favoritesContainer" class="favorites-section" style="display: none;">
        <h4>Saved Cities</h4>
        <div id="favoritesList" class="fav-list"></div>
    </div>

</div>

</body>
</html>
